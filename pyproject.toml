[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triton-inference-kit"
version = "0.0.1"
description = "High-performance Triton GPU kernels for transformer inference operations."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Maurya Panchal" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "triton>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/Maurya30/triton-inference-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/triton_inference_kit"]