[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triton-inference-kit"
version = "0.0.1"
description = "Fused Triton GPU kernels for transformer inference operations."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Maurya Panchal" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "triton>=2.1",
]

[project.optional-dependencies]
# ninja: required by torch.utils.cpp_extension.load for the CUDA kernel.
# transformers: LLaMA end-to-end test + bench (tests/test_e2e_llama.py, benchmarks/bench_e2e.py).
dev = ["pytest>=7.0", "ninja>=1.10", "transformers>=4.56"]
bench = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/Maurya30/triton-inference-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/triton_inference_kit"]

# Ship the CUDA sources inside the wheel so rmsnorm_cuda can JIT-build them
# from a non-editable install too (the wrapper looks in both locations).
[tool.hatch.build.targets.wheel.force-include]
"csrc" = "triton_inference_kit/csrc"